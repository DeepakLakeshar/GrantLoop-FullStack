version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: grantloop_prod_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - grantloop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grantloop_prod_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - grantloop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grantloop_prod_backend
    restart: unless-stopped
    command: gunicorn grantloop.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - grantloop-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grantloop_prod_celery_worker
    restart: unless-stopped
    command: celery -A grantloop worker -l info
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    networks:
      - grantloop-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grantloop_prod_celery_beat
    restart: unless-stopped
    command: celery -A grantloop beat -l info
    env_file:
      - .env
    networks:
      - grantloop-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grantloop_prod_flower
    restart: unless-stopped
    command: celery -A grantloop flower --port=5555
    env_file:
      - .env
    ports:
      - "5555:5555"
    networks:
      - grantloop-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: grantloop_prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    networks:
      - grantloop-network
    depends_on:
      - backend

networks:
  grantloop-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
