name: GrantLoop Deployment & Release Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target Cloud Platform for Deployment"
        required: true
        default: "aws-ec2"
        type: choice
        options:
          - aws-ec2
          - digitalocean
          - azure
          - railway
          - render

jobs:
  release-automation:
    name: Automatic Tagging, Changelog & SDK Release Generation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Build & Release Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g openapi-typescript

      - name: Extract Semantic Version from grantloop/version.py
        id: version
        working-directory: ./backend
        run: |
          VERSION=$(python -c "from grantloop.version import API_VERSION; print(API_VERSION)")
          echo "tag=v$VERSION-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "release_version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate OpenAPI 3.0 Schema
        working-directory: ./backend
        run: |
          python manage.py spectacular --file schema.yml --settings=grantloop.settings.sandbox_test
        env:
          DJANGO_SECRET_KEY: ci-release-generation-secret

      - name: Generate TypeScript SDK Client Types
        working-directory: ./backend
        run: |
          openapi-typescript schema.yml -o grantloop-api.d.ts

      - name: Extract Latest Changelog Sections
        id: changelog
        run: |
          if [ -f "CHANGELOG.md" ]; then
            head -n 50 CHANGELOG.md > release-notes.md
          else
            echo "Automated release build for GrantLoop API" > release-notes.md
          fi

      - name: Automatically Tag Release & Create GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version.outputs.release_version }}
          name: "GrantLoop API ${{ steps.version.outputs.release_version }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            backend/schema.yml
            backend/grantloop-api.d.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-cloud-infrastructure:
    name: Multi-Cloud Deployment Engine (EC2, DigitalOcean, Azure, Railway, Render)
    needs: release-automation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx & Build Container
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Configure Cloud Secret Variables (Safe Injection)
        run: |
          cat <<EOF > .env.prod
          DJANGO_ENV=production
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF

      - name: Deploy to AWS EC2 via SSH & Docker Compose
        if: ${{ inputs.target_environment == 'aws-ec2' || (github.event_name == 'push' && secrets.AWS_EC2_HOST != '') }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            cd /opt/grantloop
            git pull origin main
            echo "Injecting updated production secrets..."
            echo "${{ secrets.DJANGO_SECRET_KEY }}" > .secret_check
            docker compose pull || true
            docker compose up -d --build --remove-orphans

      - name: Deploy to DigitalOcean Droplet via SSH & Docker Compose
        if: ${{ inputs.target_environment == 'digitalocean' || (github.event_name == 'push' && secrets.DO_DROPLET_HOST != '') }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_DROPLET_HOST }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_DROPLET_SSH_KEY }}
          script: |
            cd /opt/grantloop
            git pull origin main
            docker compose pull || true
            docker compose up -d --build --remove-orphans

      - name: Deploy to Microsoft Azure VM / App Service via Docker Compose
        if: ${{ inputs.target_environment == 'azure' || (github.event_name == 'push' && secrets.AZURE_VM_HOST != '') }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd /var/www/grantloop
            git pull origin main
            docker compose up -d --build --remove-orphans

      - name: Deploy to Railway Platform (CLI Deployment)
        if: ${{ inputs.target_environment == 'railway' || (github.event_name == 'push' && secrets.RAILWAY_TOKEN != '') }}
        run: |
          npx @railway/cli up --service grantloop-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Render Managed Cloud (Web Hook Trigger)
        if: ${{ inputs.target_environment == 'render' || (github.event_name == 'push' && secrets.RENDER_DEPLOY_HOOK_URL != '') }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "Deploy hook triggered."
