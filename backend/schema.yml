components:
  schemas:
    BeneficiaryList:
      type: object
      description: |-
        Lightweight serializer for listing beneficiaries.
        Excludes private identifiers such as government_id.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatus548Enum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - phone_number
      - verification_status
    BeneficiaryVerification:
      type: object
      description: Validates rejection rationale during status transition requests.
      properties:
        rejection_reason:
          type: string
          maxLength: 1000
    BeneficiaryVerificationRequest:
      type: object
      description: Validates rejection rationale during status transition requests.
      properties:
        rejection_reason:
          type: string
          maxLength: 1000
    BeneficiaryWrite:
      type: object
      description: |-
        Serializer used for creating and updating beneficiary records.
        Validates field constraints via validators.py.
      properties:
        campaign:
          type: string
          format: uuid
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          maxLength: 30
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        government_id:
          type: string
          nullable: true
          maxLength: 100
        profile_photo:
          type: string
          format: uri
          nullable: true
      required:
      - address
      - campaign
      - city
      - country
      - email
      - full_name
      - phone_number
      - postal_code
      - state
    BeneficiaryWriteRequest:
      type: object
      description: |-
        Serializer used for creating and updating beneficiary records.
        Validates field constraints via validators.py.
      properties:
        campaign:
          type: string
          format: uuid
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone_number:
          type: string
          minLength: 1
          maxLength: 30
        address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        country:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        government_id:
          type: string
          nullable: true
          maxLength: 100
        profile_photo:
          type: string
          format: binary
          nullable: true
      required:
      - address
      - campaign
      - city
      - country
      - email
      - full_name
      - phone_number
      - postal_code
      - state
    CampaignDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        goal_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        raised_amount:
