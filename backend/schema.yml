openapi: 3.0.3
info:
  title: GrantLoop API & Developer Portal
  version: 1.0.0
  description: |-
    Production-grade OpenAPI 3.0 documentation for the GrantLoop SaaS platform.

    ### Authentication & Authorization
    All secured endpoints require JWT Bearer Authentication (`Authorization: Bearer <access_token>`) or OAuth2 Bearer tokens for third-party application integrations.

    **Example Fake Test JWT Access Token:**
    `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJlbWFpbCI6ImFkbWluQGdyYW50bG9vcC5leGFtcGxlIiwicm9sZSI6IkFETUlOIn0.fake_signature_hash_do_not_use_in_production`

    #### Step-by-Step JWT Token Refresh Flow:
    1. **Login:** Submit credentials via `POST /api/v1/auth/login/` to obtain an Access Token (15-min lifetime) and Refresh Token (7-day lifetime).
    2. **Authorize API Calls:** Attach header `Authorization: Bearer <access_token>` to all protected operations.
    3. **Token Expiry & Rotation:** When access token expires, submit `POST /api/v1/auth/refresh/` with `{"refresh": "<your_refresh_token>"}`.
    4. **Blacklisting:** The old refresh token is immediately blacklisted upon rotation; store and utilize the new returned token pair.

    ### Role-Based Access Control (RBAC)
    Endpoints enforce strict tenancy and role isolation between **Admin**, **NGO**, **Donor**, and **Public** personas.

    ### Pagination & Dynamic Filtering
    Standard JSON endpoint feeds utilize DRF PageNumberPagination (`?page=1&page_size=20`), returning structured wrappers (`count`, `next`, `previous`, `results`).
    Dynamic query filters are supported across search terms, ordering fields, status flags, date ranges, and UUID relationships.

    ### Rate Limits & Throttles
    Intensive endpoints (such as streaming report file exports via `?format=csv|xlsx|pdf`) are protected by `ReportExportThrottle` (`100 requests/minute`).
    If exceeded, endpoints return HTTP `429 Too Many Requests` accompanied by the explicit `Retry-After: <seconds>` HTTP header indicating cooldown pause duration.

    ### API Versioning & Deprecation Policy
    Current Stable Version: `v1` (`/api/v1/`). When future versions (`/api/v2/`) are introduced, legacy versions coexist with a guaranteed **6-month deprecation window** before sunsetting.
    During this period, responses automatically emit standard RFC 8594 `Deprecation`, `Sunset`, and `Link` HTTP response headers to notify consuming client SDKs.
  contact:
    name: GrantLoop Engineering Team
    email: dev@grantloop.example
  license:
    name: Commercial SaaS License
    url: https://grantloop.example/terms
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: Returns live system uptime status, database connectivity checks,
        environment indicators, and application git hash signatures without exposing
        sensitive infrastructure credentials.
      summary: Public System Health Diagnostic & Telemetry Feed
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                HealthReport:
                  value:
                    status: ok
                    application: GrantLoop API & Developer Portal
                    version: 1.0.0
                    environment: development
                    timestamp: '2026-08-01T20:55:00Z'
                    uptime_seconds: 3600.5
                    git_commit: c4d12a9
                    database: connected
                  summary: Health Report
          description: System diagnostic report generated successfully.
        '500':
          description: System database is unreachable or internal failure occurred.
  /api/version/:
    get:
      operationId: version_retrieve
      description: Returns lightweight API semantic versioning string, build git commit
        hash, and official release date.
      summary: Frontend Release Version Compatibility Feed
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                VersionFeed:
                  value:
                    api_version: 1.0.0
                    build: c4d12a9
                    released_at: '2026-08-01'
                  summary: Version Feed
          description: Version compatibility metadata.
  /api/changelog/:
    get:
      operationId: changelog_retrieve
      description: Returns structured semantic release logs, feature introductions,
        behavioral changes, and deprecation timeline records from repository CHANGELOG.md.
      summary: Programmatic API Evolution Release Changelog Feed
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ChangelogOutput:
                  value:
                    version: 1.0.0
                    released_at: '2026-08-01'
                    summary: Full Phase 10 OpenAPI 3.0 Documentation & Developer Portal
                      Release.
                  summary: Changelog Output
          description: Changelog retrieved.
  /api/schema/:
