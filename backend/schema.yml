servers:
- url: http://localhost:8000
  description: Local Development Sandbox Server
- url: https://staging-api.grantloop.example
  description: Staging Environment
- url: https://api.grantloop.example
  description: Production SaaS Platform
tags:
- name: Authentication
  description: JWT token obtain, rotation, blacklist, logout, and stateless password
    reset workflows.
- name: Accounts
  description: User account registration, profile queries, and persona management
    endpoints.
- name: Campaigns
  description: Fundraising campaign creation, multi-tier approval lifecycles, updates,
    and public project discovery listings.
- name: Beneficiaries
  description: Beneficiary eligibility onboarding, compliance verification, and bulk
    CSV file ingestion.
- name: Donations
  description: Multi-currency donor contributions, payment intent confirmation, receipt
    rendering, and idempotent gateway webhooks.
- name: Notifications
  description: In-app real-time alerts, automated delivery hooks, unread counters,
    and batch read state updates.
- name: Payouts
  description: NGO withdrawal request lifecycles, gateway payout disbursement execution,
    and audit-ready balance tracking.
- name: Milestones
  description: Project milestone creation, verification evidence submission review,
    and escrow tranche fund release tracking.
- name: Execution Partners
  description: On-the-ground project implementation NGO partner registration and campaign
    associations.
- name: Analytics
  description: Role-isolated interactive financial dashboards, time-series chart array
    feeds, and comparative performance leaderboards.
- name: Reports
  description: Paginated tabular audit reporting feeds and raw streaming file export
    generator pipelines (CSV, Excel, and PDF).
- name: Documents
  description: Secure compliance file upload management, cryptographic verification
    status tracking, and binary stream retrieval.
- name: Health
  description: Public system uptime monitoring, git build verification, database connectivity
    health diagnostics, and release changelog feeds.
