  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Register a new account under Admin, NGO, or Donor personas.
      summary: Register New User Persona Account
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                UserProfile:
                  value:
                    id: 1
                    email: director@hopefoundation.org
                    first_name: Deepak
                    last_name: Lakeshar
                    role: NGO
                    is_active: true
                  summary: User Profile
          description: Account registered.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ValidationFailure:
                  value:
                    detail:
                    - Invalid field parameter syntax or missing required argument.
                    code: invalid_parameter
                  summary: Validation Failure
          description: Bad Request - Invalid field parameter syntax or missing required
            values.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided or access
                      token has expired.
                    code: not_authenticated
          description: Unauthorized - Missing, malformed, or expired JWT access token.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                PermissionDenied:
                  value:
                    detail: You do not have permission to perform this action under
                      your persona role (RBAC policy violation).
                    code: permission_denied
                  summary: Permission Denied
          description: Forbidden - RBAC persona role violation (e.g., Donor attempting
            Admin operations).
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ResourceNotFound:
                  value:
                    detail: No matching resource entity found for the provided UUID.
                    code: not_found
                  summary: Resource Not Found
          description: Not Found - Requested entity UUID does not exist or user lacks
            visibility.
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                StateConflict:
                  value:
                    detail: 'State transition conflict: cannot modify an already approved
                      payout or verified beneficiary.'
                    code: conflict
                  summary: State Conflict
          description: Conflict - State transition rule violation (e.g., editing closed
            campaign or approved payout).
        '422':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                DomainVerificationError:
                  value:
                    detail: 'Unprocessable Entity: domain calculation or accounting
                      rule verification failed.'
                    code: unprocessable_entity
                  summary: Domain Verification Error
          description: Unprocessable Entity - Financial reconciliation or accounting
            rule check failed.
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                RateLimitExceeded:
                  value:
                    detail: Request limit exceeded. Expected available in 45 seconds.
                      Check Retry-After response header.
                    code: throttled
                  summary: Rate Limit Exceeded
          description: Too Many Requests - Throttled (e.g., ReportExportThrottle at
            100/min). Check Retry-After response header.
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ServerException:
                  value:
                    detail: 'Internal server error: upstream payment gateway communication
                      timed out or database disconnect occurred.'
                    code: server_error
                  summary: Server Exception
          description: Internal Server Error - Upstream gateway exception or database
            connection disruption.
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate with email and password to receive a 15-minute access
        token and 7-day rotating refresh token pair.
      summary: Obtain JWT Access and Rotating Refresh Tokens
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
