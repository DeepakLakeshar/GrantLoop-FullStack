  /api/v1/ngo-profile/:
    get:
      operationId: my_ngo_profile_retrieve
      description: |-
        GET/PUT /ngo-profile/ — the logged-in NGO's own profile.
        get_or_create semantics: an NGO account might not have created its
        profile yet, so GET/PUT both work from a blank slate.
      summary: Retrieve Logged-in NGO's Profile
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NGOProfile'
          description: ''
    put:
      operationId: my_ngo_profile_update
      description: |-
        GET/PUT /ngo-profile/ — the logged-in NGO's own profile.
        get_or_create semantics: an NGO account might not have created its
        profile yet, so GET/PUT both work from a blank slate.
      summary: Update Logged-in NGO's Profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NGOProfileWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NGOProfileWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NGOProfileWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NGOProfile'
          description: ''
