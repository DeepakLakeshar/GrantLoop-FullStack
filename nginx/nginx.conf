user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------------------
    # Security & Slow Client Protection
    # ----------------------------------------------------------------------
    # Hide Nginx version information
    server_tokens off;

    # Timeouts to mitigate Slowloris DDoS attacks
    client_header_timeout 12s;
    client_body_timeout   12s;
    keepalive_timeout     15s;
    send_timeout          10s;

    # ----------------------------------------------------------------------
    # Buffering & Upload Limits (50MB uploads)
    # ----------------------------------------------------------------------
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    proxy_buffers 16 16k;  
    proxy_buffer_size 16k;

    # ----------------------------------------------------------------------
    # Logging Configuration
    # ----------------------------------------------------------------------
    # Support extracting X-Request-ID from Django or generating one
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'req_id="$http_x_request_id"';

    access_log  /var/log/nginx/access.log  main;

    # ----------------------------------------------------------------------
    # Gzip Compression
    # ----------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/xml
        text/javascript;

    # ----------------------------------------------------------------------
    # Rate Limiting & WebSocket Map
    # ----------------------------------------------------------------------
    # Restrict API abuse (e.g. 100 requests per minute per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Map for WebSocket readiness
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Include modular server blocks
    include /etc/nginx/conf.d/*.conf;
}
