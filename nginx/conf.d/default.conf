upstream grantloop_backend {
    server backend:8000;
    # Support Keep-Alive connections to Django backend
    keepalive 32;
}

# ----------------------------------------------------------------------
# HTTP to HTTPS Redirect Server Block
# ----------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt ACME challenge location placeholder
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# HTTPS Production Server Block
# ----------------------------------------------------------------------
server {
    # ----------------------------------------------------------------------
    # TLS / SSL Configuration (Placeholders)
    # ----------------------------------------------------------------------
    # In a real deployment with mounted certificates, uncomment these:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # server_name grantloop.com www.grantloop.com api.grantloop.com;
    
    # ssl_certificate /etc/letsencrypt/live/grantloop.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/grantloop.com/privkey.pem;

    # For local validation passing without SSL certs, we use port 443 (HTTP mode).
    listen 443;
    server_name _;

    # ----------------------------------------------------------------------
    # Security Headers
    # ----------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # CSP tradeoff: using 'unsafe-inline' for styles/scripts to ensure Swagger UI and frontend
    # development tools do not immediately break. In a hardened environment, replace with nonces.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # ----------------------------------------------------------------------
    # Static Assets (1 Year Cache)
    # ----------------------------------------------------------------------
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ----------------------------------------------------------------------
    # Media Uploads (30 Days Cache)
    # ----------------------------------------------------------------------
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ----------------------------------------------------------------------
    # API Healthcheck (Never Cached)
    # ----------------------------------------------------------------------
    location = /api/health/ {
        proxy_pass http://grantloop_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Force strict no-cache directives
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ----------------------------------------------------------------------
    # Django Backend Reverse Proxy
    # ----------------------------------------------------------------------
    location /api/ {
        # Apply rate limiting (100 req/min) without delaying bursts
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://grantloop_backend;
        
        # HTTP/1.1 and Keep-Alive support
        proxy_http_version 1.1;
        
        # WebSocket Readiness
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward headers to Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward Django Request ID
        proxy_set_header X-Request-ID $request_id;

        proxy_redirect off;
        
        # Proxy timeouts suitable for large report generation (120s)
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;

        # API responses should not be cached by the browser
        add_header Cache-Control "no-store";
    }
}
